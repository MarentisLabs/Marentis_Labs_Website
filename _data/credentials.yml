# Credentials data — the single source of truth for about.html.
# Edit here; the page updates automatically. There are no hard-coded copies.
#
# This file is `credentials.yml`, so every key below hangs off
# `site.data.credentials`. Liquid paths:
#     site.data.credentials.executive
#     site.data.credentials.board
#     site.data.credentials.policies
# `site.data.policies` and `site.data.board` resolve to nothing.
#
# `summary` is rendered unescaped, so inline HTML (links) is allowed.

executive:
  - firm: "SICO Bank"
    title: "Group Chief Risk Officer"
    summary: >
      First Group CRO across a $6bn AUM institution spanning three jurisdictions.
      Led Risk Framework overhaul, regulatory capital strategy, and board-level 
      risk governance from inception.

  - firm: "Credit Suisse"
    title: "Head of Fiduciary Risk, UK"
    summary: >
      Governance and risk oversight of £50bn+ AUM across equities, fixed income, multi-asset, CLO funds, Infrastructure funds and real estate. 
      Regulatory engagement on fund governance, capital management strategies and fiduciary risk requirements.

  - firm: "JP Morgan"
    title: "Vice President, Asset Management Risk Management"
    summary: >
      Risk architecture for a $245bn institutional client platform migration. 
      Institutional clients across all asset classes. 
      Delivered without material client loss or regulatory incident.

  - firm: "Morgan Stanley"
    title: "Advisory Role"
    summary: >
      Early-career experience in advisory roles across risk and governance,
      establishing patterns of regulatory engagement and complex institutional
      problem-solving.

board:
  - firm: "Active Prospects"
    title: "Chairman"
    summary: >
      Chaired the board through a 3.4x revenue turnaround over five years, from £6.5m to £22m+.
      Restructured the committee architecture, professionalised board governance, and established
      oversight practice now ranked among the sector’s top tier. Number 8 in the Great Place to Work
      2026 rankings for large organisations
      <a href="https://www.greatplacetowork.co.uk/uks-best-workplaces?size=large">(greatplacetowork.co.uk)</a>

  - firm: "Children’s Commissioner for England"
    title: "Non-Executive Member, Audit & Risk Committee"
    summary: >
      Served two terms, 2016–2020, on the Audit and Risk Committee of an arm’s-length
      body reporting to Parliament. Governance guidance on audit, risk, internal
      controls, and parliamentary oversight expectations.

  - firm: "EdAct Trust"
    title: "Non-Executive Director - Trust Member"
    summary: >
      Governance and strategic guidance across an educational trust
      managing multiple school settings.

