<!DOCTYPE html>
<html lang="en-GB" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Analytics 4 — first-party statistical measurement (no advertising, no Google Signals) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    (function () {
      var choice;
      try { choice = localStorage.getItem('ml_cookie_consent'); } catch (e) {}
      if (choice === 'essential' || choice === 'rejected') {
        window['ga-disable-G-VB6Q21MBY5'] = true;
        return;
      }
      gtag('js', new Date());
      gtag('config', 'G-VB6Q21MBY5', {
        'allow_google_signals': false,
        'allow_ad_personalization_signals': false
      });
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-VB6Q21MBY5';
      document.head.appendChild(s);
    })();
  </script>

  <!-- SEO, Open Graph & Canonical handled by jekyll-seo-tag -->

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />

  <!-- Fonts — v3.2: Cormorant SC (display 32px+) + DM Sans (sub-headings/UI) + Inter (body) + Cormorant (decorative glyph) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@300;400;500;600;700&family=Cormorant:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />

  <!-- Compiled CSS (replaces Tailwind CDN) -->
  <link rel="stylesheet" href="/assets/css/style.css" />

  <!-- Tocbot (article pages only) -->
  {% if page.layout == 'article' %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tocbot@4/dist/tocbot.css" />
  {% endif %}

  <!-- Schema.org structured data -->
  {% include schema.html %}

  <!-- Jekyll SEO tag -->
  {% seo %}
</head>
<body class="bg-white text-ml-charcoal">

  <!-- ── Navigation ──────────────────────────────────────────── -->
  {% include nav.html %}

  <!-- ── Page content ────────────────────────────────────────── -->
  <main>
    {{ content }}
  </main>

  <!-- ── Footer ──────────────────────────────────────────────── -->
  {% include footer.html %}

  <!-- ── Cookie consent ──────────────────────────────────────── -->
  {% include cookie-consent.html %}

  <!-- ── Scripts ─────────────────────────────────────────────── -->
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
