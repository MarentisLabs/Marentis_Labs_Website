# ─────────────────────────────────────────────────────────────
# Marentis Labs — Jekyll Configuration
# ─────────────────────────────────────────────────────────────

title: "Marentis Labs"
lang: "en_GB"
tagline: "Strategic Governance as a Service. Adversarial by Design."
description: "Marentis Labs provides Strategic Governance as a Service to FTSE 350 companies and PE-backed organisations. Principal-led, continuous, adversarial by design."
url: "https://marentislabs.com"
baseurl: ""
email: "info@marentislabs.com"
location: "London, UK"
calendly: "https://calendar.proton.me/bookings#2KEJqTjEvueYTPNxCKo_4TTEKS8XtY9lNHMTqXlpPK0="

exclude:
  - "**/*.qmd"
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github
  - vendor
  # Dev/scratch files — kept in the repo, never shipped in the built site
  - CLAUDE.md
  - WEBSITE-AUDIT-2026-07.md
  - WEBSITE-AUDIT-2026-08.md
  - WEBSITE-AUDIT-2026-08-ACTIONS.md
  - PUBLISHING-ARTICLES.md
  - "Privacy Notice.md"
  - implement-web3forms.md
  - white-paper-gate-implementation.html
  - white-paper-gate-implementation.md
  - white-paper-implementation-plan.html
  - white-paper-implementation-plan.md
  - marentislabs.com-Coverage-2026-03-30.xlsx
  - Marentis_Labs_Brand_Identity_SGaaS.docx
  - package.json
  - package-lock.json
  - tailwind.config.js

# Plugins (all available free on GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO defaults
author:
  name: "Owen Vallis"
  twitter: "marentislabs"

# Social
twitter:
  username: "marentislabs"
  card: "summary_large_image"
linkedin: ""

# NOTE: jekyll-seo-tag reads the social image from `page.image` ONLY — a
# site-level `image:` key here is silently ignored. The site-wide default is
# therefore set in the `defaults:` block below, where any page can override it
# with its own `image:` in front matter.

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

collections:
  illustrations:
    output: true
    permalink: /illustrative-engagements/:name/

defaults:
  # Site-wide social sharing card (1200x630). jekyll-seo-tag resolves og:image
  # and twitter:image from `page.image`, so it has to be set as a default here
  # rather than as a top-level `image:` key. Setting it also restores
  # twitter:card to summary_large_image — without an image the plugin forces
  # the card back to "summary". Any page may override with its own `image:`.
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/marentis-labs-social-card.png"
        width: 1200
        height: 630
        alt: "Marentis Labs — Strategic Governance as a Service. Adversarial by Design."

  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "services"
      type: "pages"
    values:
      layout: "service"
  - scope:
      path: "insights/posts"
      type: "pages"
    values:
      layout: "article"
  - scope:
      path: ""
      type: "illustrations"
    values:
      layout: "illustration"

  # Keep raw interactive widget component files out of the sitemap.
  # These are embed/iframe sources; the canonical indexable pages are at
  # /insights/interactives/…/. jekyll-sitemap includes static .html files,
  # so they are excluded here via a front-matter default.
  - scope:
      path: "assets/interactives"
    values:
      sitemap: false
