<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://marentislabs.com/#organization",
      "name": "Marentis Labs",
      "legalName": "Marentis Labs Ltd",
      "url": "https://marentislabs.com",
      "foundingDate": "2025-07",
      "logo": {
        "@type": "ImageObject",
        "url": "https://marentislabs.com/assets/images/Marentis_Labs_Full_Logo.png"
      },
      "description": "Strategic Governance as a Service for FTSE 350 companies and PE-backed organisations. Principal-led, continuous, adversarial by design.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "London",
        "addressCountry": "GB"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "info@marentislabs.com",
        "contactType": "business enquiries"
      },
      "sameAs": [
        "https://www.linkedin.com/company/marentislabs",
        "https://find-and-update.company-information.service.gov.uk/company/16600357"
      ]
    },
    {
      "@type": "Person",
      "@id": "https://marentislabs.com/#owen-vallis",
      "name": "Owen Vallis",
      "jobTitle": "Managing Director",
      "description": "Strategic risk executive with a 20-year risk career culminating as Group Chief Risk Officer at SICO Bank, following ten years as UK Head of Fiduciary Risk at Credit Suisse and earlier risk roles at J.P. Morgan and Morgan Stanley, plus over a decade as an Independent Non-Executive Director across the public and private sectors. Active board Chair (Active Prospects) and NED (EdAct Trust); former NED, Audit & Risk Committee, Children's Commissioner for England (2016–2020). Originator of Strategic Governance as a Service (SGaaS).",
      "worksFor": { "@id": "https://marentislabs.com/#organization" },
      "affiliation": {
        "@type": "Organization",
        "name": "Marentis Labs Ltd"
      },
      "hasOccupation": {
        "@type": "Occupation",
        "name": "Chief Risk Officer",
        "description": "20-year risk career culminating as Group Chief Risk Officer at SICO Bank, following ten years as UK Head of Fiduciary Risk at Credit Suisse and risk roles at J.P. Morgan and Morgan Stanley, including governance and risk oversight of £50bn+ AUM and multi-jurisdictional regulatory engagement (FCA, PRA, CBB, SCA).",
        "occupationalCategory": "Risk Management"
      },
      "memberOf": [
        {
          "@type": "Organization",
          "name": "Active Prospects",
          "description": "Board Chairman. Led a 3.4x revenue turnaround over five years, £6.5m to £22m+."
        },
        {
          "@type": "Organization",
          "name": "EdAct Trust",
          "description": "Non-Executive Director of an educational trust managing multiple school settings."
        }
      ],
      "url": "https://marentislabs.com/about/",
      "knowsAbout": [
        "corporate governance",
        "risk management",
        "board advisory",
        "Strategic Governance as a Service",
        "UK Corporate Governance Code Provision 29",
        "Basel III",
        "DORA",
        "FCA regulation",
        "PE exit governance"
      ],
      "sameAs": [
        "https://www.linkedin.com/in/owen-vallis/",
        "https://find-and-update.company-information.service.gov.uk/search?q=Owen+Vallis"
      ]
    },
    {
      "@type": "Service",
      "@id": "https://marentislabs.com/#strategic-gaas",
      "name": "Strategic Governance as a Service",
      "provider": { "@id": "https://marentislabs.com/#organization" },
      "description": "Continuous, principal-level governance advisory for FTSE 350 boards and PE-backed organisations. Four-tier model: Diagnostic, Retained, Embedded, and Pre-Exit SGaaS.",
      "areaServed": {
        "@type": "Country",
        "name": "United Kingdom"
      },
      "serviceType": "Governance Advisory"
    }
    {% if page.layout == 'service' %},
    {
      "@type": "Service",
      "name": "{{ page.title }}",
      "provider": { "@id": "https://marentislabs.com/#organization" },
      "description": "{{ page.description | default: page.strapline }}",
      "url": "https://marentislabs.com{{ page.url }}"
    }
    {% endif %}
    {% if page.schema_white_paper %},
    {
      "@type": "Report",
      "@id": "https://marentislabs.com/white-paper/#report",
      "name": "Strategic Governance as a Service — The Definitive Framework",
      "headline": "The Definitive Framework for Strategic Governance as a Service",
      "description": "90+ pages of practitioner-authored governance frameworks for FTSE 350 boards, PE-backed organisations, and FCA-regulated entities. Defines the Adversarial Governance Methodology and originates SGaaS as a defined service category.",
      "url": "https://marentislabs.com/white-paper/",
      "datePublished": "2026-05-21",
      "dateModified": "{{ page.last_modified_at | default: '2026-05-21' | date_to_xmlschema }}",
      "inLanguage": "en-GB",
      "author": {
        "@id": "https://marentislabs.com/#owen-vallis"
      },
      "publisher": {
        "@id": "https://marentislabs.com/#organization"
      },
      "about": [
        { "@type": "Thing", "name": "corporate governance" },
        { "@type": "Thing", "name": "Strategic Governance as a Service" },
        { "@type": "Thing", "name": "risk management" },
        { "@type": "Thing", "name": "FTSE 350 board governance" },
        { "@type": "Thing", "name": "PE exit governance" },
        { "@type": "Thing", "name": "Basel 3.1" },
        { "@type": "Thing", "name": "FCA regulatory compliance" }
      ],
      "audience": {
        "@type": "Audience",
        "audienceType": "FTSE 350 CFOs, Chairs, Governance Committees, PE Operating Partners"
      },
      "encodingFormat": "application/pdf",
      "contentUrl": "https://marentislabs.com/assets/downloads/marentis-labs-strategic-governance-as-a-service-white-paper.pdf",
      "isPartOf": {
        "@id": "https://marentislabs.com/#strategic-gaas"
      }
    }
    {% endif %}
    {% if page.layout == 'article' %},
    {
      "@type": "BlogPosting",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "https://marentislabs.com{{ page.url }}"
      },
      "headline": "{{ page.title }}",
      "description": "{{ page.description | default: page.excerpt | strip_html | truncatewords: 30 }}",
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
      "author": {
        "@id": "https://marentislabs.com/#owen-vallis"
      },
      "publisher": {
        "@id": "https://marentislabs.com/#organization"
      }
    }
    {% endif %}
    {% if page.last_modified_at and page.layout != 'article' and page.schema_white_paper != true %},
    {
      "@type": "WebPage",
      "@id": "https://marentislabs.com{{ page.url }}#webpage",
      "url": "https://marentislabs.com{{ page.url }}",
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | default: page.strapline | default: "" | jsonify }},
      "datePublished": "{{ page.date | default: page.last_modified_at | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | date_to_xmlschema }}",
      "isPartOf": { "@id": "https://marentislabs.com/#organization" },
      "about": { "@id": "https://marentislabs.com/#strategic-gaas" },
      "publisher": { "@id": "https://marentislabs.com/#organization" }
    }
    {% endif %}
    {% if page.layout == 'service' or page.layout == 'article' or page.layout == 'illustration' %},
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://marentislabs.com/" },
        {% if page.layout == 'service' %}{ "@type": "ListItem", "position": 2, "name": "Services", "item": "https://marentislabs.com/services/" }{% elsif page.layout == 'article' %}{ "@type": "ListItem", "position": 2, "name": "Insights", "item": "https://marentislabs.com/insights/" }{% else %}{ "@type": "ListItem", "position": 2, "name": "Illustrative Engagements", "item": "https://marentislabs.com/illustrative-engagements/" }{% endif %},
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "https://marentislabs.com{{ page.url }}" }
      ]
    }
    {% endif %}
  ]
}
</script>
